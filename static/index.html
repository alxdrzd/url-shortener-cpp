<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ URL Shortener</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; }
        input { width: 70%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; word-break: break-all; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
<h1>🔗 URL Shortener</h1>
<p>Backend on C++ (Boost.Asio + PostgreSQL)</p>

<input type="text" id="longUrl" placeholder="Paste your long link here..." required>
<br>
<input type="number" id="userId" placeholder="User ID" value="1" style="width: 20%;">
<br>
<button onclick="shortenUrl()">Shorten</button>

<div id="result"></div>

<script>
    async function shortenUrl() {
        const urlInput = document.getElementById('longUrl').value;
        const userIdInput = document.getElementById('userId').value;
        const resultDiv = document.getElementById('result');

        if (!urlInput) {
            resultDiv.innerHTML = '<span class="error">Please enter a URL</span>';
            return;
        }

        try {
            // Отправляем POST запрос на этот же сервер
            const response = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    original_url: urlInput,
                    user_id: parseInt(userIdInput)
                })
            });

            const data = await response.json();

            if (response.ok) {
                // Если всё хорошо, показываем ссылку
                resultDiv.innerHTML = `
                        <span class="success">Success!</span><br>
                        <a href="${data.short_url}" target="_blank">${data.short_url}</a>
                    `;
            } else {
                // Если ошибка (например, юзера нет)
                resultDiv.innerHTML = `<span class="error">Error: ${data.message || 'Unknown error'}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<span class="error">Network error: ${err.message}</span>`;
        }
    }
</script>
</body>
</html>
